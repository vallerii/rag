<!doctype html><html lang="de"><head><meta charset="utf-8"><style>.rx .rx-check-report-section{padding-block:48px;box-sizing:border-box}.rx .rx-report-tablet{align-self:center} #demo-note{font-size:12px;color:#666;margin-top:12px} 
.rx .rx-check-report-form{margin-top:30px}.rx .rx-check-report-form h3{margin-bottom:18px}

/* Unified company profile and Google-style review summary. */

.rx{--rx-bg:#f8f7f5;--rx-surface:#fff}
.rx .rx-report-tablet .rx-example-report{background:#fff}
.rx .rx-company-card{padding:20px 21px 18px;background:#fff;border:1px solid #e8e8e8;border-radius:17px;box-shadow:0 3px 12px #17171704}
.rx .rx-company-card .rx-report-company{min-height:0;gap:13px;align-items:center}
.rx .rx-company-card .rx-report-avatar{width:44px;height:44px;background:#fff;border:1px solid #ededed;border-radius:12px;font-size:15px}
.rx .rx-company-card .rx-report-company h3{font-size:21px;letter-spacing:-.04em;line-height:1.25}
.rx .rx-company-card .rx-report-label{font-size:8px;letter-spacing:.06em;margin-bottom:5px}
.rx .rx-company-card .rx-report-company-details>p{font-size:10px;margin-top:5px}
.rx .rx-company-card .rx-report-maps-logo{width:23px;height:28px;align-self:center}
.rx .rx-company-card .rx-report-rating{padding:0;margin-top:16px;border:0;gap:10px;flex-wrap:wrap}
.rx .rx-company-card .rx-report-rating strong{font-size:25px;font-weight:500;line-height:1;letter-spacing:-.05em;color:#222}
.rx .rx-company-card .rx-report-stars{color:#ffca00;font-size:19px;letter-spacing:2px;line-height:1}
.rx .rx-company-card .rx-report-rating>span:last-child{font-size:10px;color:#777;margin-left:auto}
.rx .rx-report-tablet .rx-report-summary{padding-block:28px}
@media(max-width:420px){.rx .rx-company-card{padding:16px}.rx .rx-company-card .rx-report-avatar{width:35px;height:35px;font-size:12px}.rx .rx-company-card .rx-report-company{gap:10px}.rx .rx-company-card .rx-report-company h3{font-size:18px}.rx .rx-company-card .rx-report-maps-logo{width:20px}.rx .rx-company-card .rx-report-rating{gap:8px;padding-top:0;margin-top:14px}.rx .rx-company-card .rx-report-rating strong{font-size:23px}.rx .rx-company-card .rx-report-stars{font-size:17px;letter-spacing:1px}.rx .rx-company-card .rx-report-rating>span:last-child{font-size:9px}}

/* Make the visitor's own check the inviting next step. */
.rx .rx-check-report-form{position:relative;isolation:isolate;margin-top:30px;padding:27px;background:#fff;border:1px solid #ff5b2e35;border-radius:23px;box-shadow:0 16px 40px -30px #ff5b2e60}
.rx .rx-check-report-form:before{content:"";position:absolute;z-index:-1;inset:auto 16% -20px;height:45px;background:#ff5b2e20;filter:blur(25px);border-radius:50%;pointer-events:none}
.rx .rx-check-report-form h3{font-size:20px!important;font-weight:500;letter-spacing:-.035em;margin-bottom:21px;line-height:1.3}
.rx .rx-check-report-form .bc-form{background:#fff!important;border:0!important;padding:0!important;border-radius:0!important;gap:12px!important}
.rx .rx-check-report-form .bc-form input{background:#fff!important;border:1px solid #dedbd7!important;border-radius:12px!important;padding:16px!important;min-height:52px;font-size:14px!important;transition:border-color .18s,box-shadow .18s}
.rx .rx-check-report-form .bc-form input:focus{border-color:#ff5b2e!important;box-shadow:0 0 0 3px #ff5b2e17!important;outline:0!important}
.rx .rx-check-report-form .bc-form input::placeholder{color:#8a8580}
.rx .rx-check-report-form .bc-form button{background:#ff5b2e!important;color:#fff!important;min-height:50px;font-size:13px!important;font-weight:500;box-shadow:0 5px 14px #ff5b2e23!important;transition:background .18s,transform .18s!important}
.rx .rx-check-report-form .bc-form button:hover{background:#e94e24!important;transform:translateY(-1px)}
.rx .rx-check-report-form .bc-form button:focus-visible{outline:2px solid #ff5b2e;outline-offset:3px}
.rx .rx-check-report-form>small{text-align:center;font-size:10px;margin-top:15px;color:#87817a}
.rx .rx-report-tablet .rx-example-report{background:#fff!important}
@media(max-width:420px){.rx .rx-check-report-form{padding:23px}.rx .rx-check-report-form h3{font-size:19px!important}}

/* Quiet white search card; visible score colors even before scripts run. */
.rx .rx-check-report-form{border:1px solid #fff;box-shadow:0 10px 35px -25px #17171720}
.rx .rx-check-report-form:before{display:none}
.rx .rx-check-report-form .bc-form button{background:#111215!important;color:#fff!important;box-shadow:none!important}
.rx .rx-check-report-form .bc-form button:hover{background:#292a2e!important}
.rx .rx-check-report-form .bc-form button:focus-visible{outline-color:#111215}

.rx .rx-check-report-copy>.rx-discover-subtitle{font-size:18px!important;line-height:1.5!important;margin:18px 0 0!important;color:var(--rx-ink)!important;letter-spacing:-.02em}
.rx .rx-check-report-copy .rx-check-report-form{margin-top:24px}
.rx .rx-report-tablet .rx-report-summary h3{font-size:clamp(18px,2vw,23px);line-height:1.25;overflow-wrap:anywhere}
.rx .rx-report-avatar{overflow:hidden;padding:0!important}
.rx .rx-report-avatar img{display:block;width:100%;height:100%;object-fit:cover;object-position:center center}

/* Bright traffic-light progress colors for the iPad report. */
.rx .rx-report-tablet .rx-report-scores>div:nth-child(1){--rx-bar-color:#26935b}
.rx .rx-report-tablet .rx-report-scores>div:nth-child(2),
.rx .rx-report-tablet .rx-report-scores>div:nth-child(3),
.rx .rx-report-tablet .rx-report-scores>div:nth-child(4){--rx-bar-color:#F2B800}
.rx .rx-report-tablet .rx-score-track i{background:var(--rx-bar-color,#F2B800)}




/* RAG iPad: monotonic numeric/progress animation; no competing CSS transforms. */
.rx .rx-report-tablet .rx-report-scores i {
  display: block;
  transform: none !important;
  transition: none !important;
  transform-origin: left center;
  will-change: width;
}
.rx .rx-report-tablet .rx-ring-value { transition: none !important; }
.rx .rx-report-tablet .rx-report-scores dd,
.rx .rx-report-tablet .rx-score-ring strong { font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) {
  .rx .rx-report-tablet .rx-report-scores i { will-change: auto; }
}

#unternehmen .rx-report-avatar img{width:100%;height:100%;object-fit:cover;object-position:center center;border-radius:inherit;display:block}

let index = 0;
const dots = all('.rx-report-dots button');
const motionPreference = matchMedia('(prefers-reduced-motion: reduce)');
const scoreItems = all('.rx-report-scores>div').map((el) => {
  const dd = el.querySelector('dd');
  let numberText = dd.firstChild;
  if (!numberText || numberText.nodeType !== 3) {
    numberText = document.createTextNode('');
    dd.prepend(numberText);
  }
  return { el, dd, numberText, bar: el.querySelector('.rx-score-track i') };
});
const ringValue = q('.rx-ring-value');
const ringLabel = q('.rx-score-ring strong');
const DURATION_MS = 1350;
const AUTOPLAY_MS = 4000;
let currentValues = [...examples[0][6]];
let currentScore = examples[0][5];
let animationFrame = 0;
let autoplayTimer = 0;
let targetValues = [...currentValues];
let targetScore = currentScore;

function metricColor(value) {
  return value < 30 ? '#d93838' : value >= 70 ? '#26935b' : '#F2B800';
}

function paintMetrics(values, score) {
  currentValues = [...values];
  currentScore = score;
  scoreItems.forEach(({ numberText, bar }, i) => {
    numberText.nodeValue = String(Math.round(values[i]));
    bar.style.width = Math.max(0, Math.min(100, values[i])).toFixed(3) + '%';
  });
  ringLabel.textContent = String(Math.round(score));
  ringValue.style.strokeDasharray = score.toFixed(3) + ' 100';
}

function animateMetrics(nextValues, nextScore, instant = false) {
  if (animationFrame) cancelAnimationFrame(animationFrame);
  animationFrame = 0;
  targetValues = [...nextValues];
  targetScore = nextScore;

  if (instant || motionPreference.matches) {
    paintMetrics(targetValues, targetScore);
    return;
  }

  // Start from the exact displayed values, even if the user clicks another slide mid-animation.
  const fromValues = [...currentValues];
  const fromScore = currentScore;
  const beginTime = performance.now();
  function tick(now) {
    const progress = Math.min(1, Math.max(0, (now - beginTime) / DURATION_MS));
    // Fast in the beginning, then visibly slows down toward the final integer.
    const eased = 1 - Math.pow(1 - progress, 3);
    const nextFrame = fromValues.map((from, i) => from + (targetValues[i] - from) * eased);
    const scoreFrame = fromScore + (targetScore - fromScore) * eased;
    paintMetrics(nextFrame, scoreFrame);
    if (progress < 1) {
      animationFrame = requestAnimationFrame(tick);
    } else {
      animationFrame = 0;
      paintMetrics(targetValues, targetScore);
    }
  }
  animationFrame = requestAnimationFrame(tick);
}

function render(instant = false) {
  const [name, category, initials, rating, reviews, score, values] = examples[index];
  q('.rx-report-company h3').textContent = name;
  q('.rx-report-company-details>p').textContent = category;
  q('.rx-report-avatar img').src = avatarPhotos[index];
  q('.rx-report-rating strong').textContent = rating;
  q('.rx-report-rating>span:last-child').textContent = reviews + ' Bewertungen';
  q('.rx-report-stars').setAttribute('aria-label', rating + ' von 5 Sternen');
  q('.rx-score-ring').setAttribute('aria-label', 'Lokaler Sichtbarkeitsindex: ' + score + ' von 100');
  ringValue.style.stroke = metricColor(score);

  scoreItems.forEach(({ el, dd, bar }, i) => {
    const color = metricColor(values[i]);
    el.classList.toggle('needs-attention', values[i] < 30);
    dd.style.color = color;
    bar.style.backgroundColor = color;
  });

  dots.forEach((button, i) => {
    if (i === index) button.setAttribute('aria-current', 'true');
    else button.removeAttribute('aria-current');
  });
  q('#rx-report-example').setAttribute('aria-label', (index + 1) + ' von 3: ' + name);
  animateMetrics(values, score, instant);
}

function restartAutoplay() {
  clearInterval(autoplayTimer);
  autoplayTimer = setInterval(() => {
    if (!document.hidden) {
      index = (index + 1) % examples.length;
      render();
    }
  }, AUTOPLAY_MS);
}

dots.forEach((button, i) => button.addEventListener('click', () => {
  index = i;
  render();
  restartAutoplay();
}));
motionPreference.addEventListener('change', () => {
  if (motionPreference.matches) animateMetrics(targetValues, targetScore, true);
});

render(true);
restartAutoplay();
</script></body></html>
